.xh * { box-sizing: border-box; }
.xh h1, .xh h2, .xh .x-logo, .xh .code {

.xh a { color: inherit; text-decoration: none; }
.xh .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; width: 100%; }

/* header */
.xh header { border-bottom: 1px solid var(--border-light); }

}
.xh .x-logo .sub {

}
.xh .nav-links { display: flex; align-items: center; gap: 28px; font-size: 14px; font-weight: 500; }
.xh .nav-links a:hover { color: var(--purple-light); }

/* stripe */
.xh .stripes {
  height: 14px;
  width: 100%;
  background-image: repeating-linear-gradient(-45deg,
    var(--off-white) 0, var(--off-white) 14px,
    var(--black) 14px, var(--black) 28px);
}

/* main */
.xh .four04 {

  justify-content: center;

  padding: 72px 0 88px;

  overflow: hidden;
}
.xh .four04-corner {

  bottom: -60px;
  left: -60px;
  width: 340px;
  height: 340px;
  background-image: repeating-linear-gradient(-45deg,
    var(--off-white) 0, var(--off-white) 12px,

  opacity: .07;
  clip-path: polygon(0 30%, 70% 100%, 0 100%);
}
.xh .four04-inner { position: relative; max-width: 560px; }
.xh .code {
  font-size: 128px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.03em;
}
.xh .code span { color: var(--purple); }
.xh .divider-mini {
  width: 72px;
  height: 8px;
  margin: 26px auto 30px;
  background-image: repeating-linear-gradient(-45deg,
    var(--off-white) 0, var(--off-white) 8px,
    var(--black) 8px, var(--black) 16px);
  border: 1px solid var(--border-light);
}
.xh .four04 h1 { font-size: 28px; margin-bottom: 14px; }
.xh .four04 p { color: rgba(247,245,240,.68); font-size: 16px; margin: 0 auto 32px; max-width: 440px; }
.xh .btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.xh .btn-primary {
  background: var(--purple);
  color: var(--black);
  font-weight: 600;
  font-size: 15px;
  padding: 14px 26px;
  border-radius: 3px;
  box-shadow: 0 0 28px var(--purple-glow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.xh .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 36px var(--purple-glow); }
.xh .btn-ghost {
  border: 1.5px solid var(--border-light);
  color: var(--off-white);
  font-weight: 600;
  font-size: 15px;
  padding: 14px 26px;
  border-radius: 3px;
  transition: border-color .15s ease;
}
.xh .btn-ghost:hover { border-color: var(--purple-light); color: var(--purple-light); }

/* footer */
.xh footer {
  border-top: 1px solid var(--border-light);
  color: rgba(247,245,240,.55);
  padding: 28px 0 34px;
  font-size: 13px;
}
.xh footer .foot-row {

  flex-wrap: wrap;

}
.xh footer a:hover { color: var(--purple-light); }
.xh footer .foot-links { display: flex; gap: 22px; }

@media (max-width: 860px) {
