# Cloudflare Workers static-assets config.
#
# The site itself is plain static HTML/CSS/JS with no build step. Cloudflare
# runs `npx wrangler deploy`, which reads this file to learn that the repo
# root IS the site (the [assets] block below).
#
# `main` points at a small Worker script (src/worker.js) that handles one
# custom route — POST /api/contact, the contact-form backend — and falls
# through to env.ASSETS.fetch() for everything else, which serves the static
# site exactly as before. Without `main`/the ASSETS binding, /api/contact has
# nothing to run against and the form would fail silently in production.
#
# `name` must match the Worker/project name in the Cloudflare dashboard.
name = "xebra-holdings-site"
compatibility_date = "2026-07-15"
main = "src/worker.js"

[assets]
# Serve the repo root. Files listed in .assetsignore are NOT uploaded.
# Default html_handling serves index.html at "/", privacy-policy.html at
# "/privacy-policy", and terms.html at "/terms" — matching the nav links.
directory = "."
# Serve the branded 404.html (with a 404 status) for any unmatched path.
not_found_handling = "404-page"
# Exposes static-asset serving to the Worker as env.ASSETS.fetch(request).
binding = "ASSETS"
